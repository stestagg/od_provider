[package]
name = "od_provider"
version = "0.1.0"
edition = "2021"
description = "Inventory-backed, config-deserializable provider registries for traits"

[workspace]
members = ["od_provider_macros"]

[dependencies]
od_provider_macros = { path = "od_provider_macros", version = "0.1.0" }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
